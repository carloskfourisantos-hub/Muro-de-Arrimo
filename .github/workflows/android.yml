# Monta o aplicativo Android e gera o APK. O resultado fica em "Artifacts", na página da execução.
name: Aplicativo Android

on:
  push:
    paths:
      - "android/**"
      - "core/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Dependências do Python
        run: python -m pip install numpy pydantic matplotlib pytest

      - name: Teste da ponte de cálculo
        run: python -m pytest tests/test_android.py -q

      - name: Montar o aplicativo (android/www)
        working-directory: android
        run: |
          npm install
          python montar.py

      - name: Projeto Android (Capacitor)
        working-directory: android
        run: |
          npx cap add android
          npx cap sync android

      - name: Gerar o APK
        working-directory: android/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: MuroDeArrimo-apk
          path: android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Guardar o aplicativo web (PWA)
        uses: actions/upload-artifact@v4
        with:
          name: MuroDeArrimo-web
          path: android/www
